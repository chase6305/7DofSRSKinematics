name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: srs-viser-lab --validate-only
      - run: srs-viser-lab --demo trajectory --plane tool-xy --path-size 0.015 --frames 12 --export-csv /tmp/srs-trajectory.csv
      - run: python examples/viser_demo.py --validate-only --validation-samples 10
      - run: python examples/viser_demo.py --validate-only --validation-samples 10 --search-mode global
      - run: python -m compileall -q src examples
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python tools/check_wheel.py dist/*.whl
      - name: Validate the installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          srs-viser-lab --validate-only
          srs-viser-lab --demo trajectory --plane tool-xy --path-size 0.015 --frames 12 --export-csv trajectory.csv
